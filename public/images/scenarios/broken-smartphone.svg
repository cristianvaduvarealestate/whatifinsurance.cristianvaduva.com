<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051F20" />
      <stop offset="60%" stop-color="#0B2B26" />
      <stop offset="100%" stop-color="#163832" />
    </linearGradient>
    <radialGradient id="impactGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DE1110" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#051F20" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Floor/Concrete -->
  <rect width="800" height="500" fill="url(#phoneBg)" />
  <rect x="0" y="340" width="800" height="160" fill="#051F20" opacity="0.8" />
  <line x1="0" y1="340" x2="800" y2="340" stroke="#163832" stroke-width="2" />

  <!-- Smartphone Body (Angled on ground) -->
  <g transform="translate(400, 240) rotate(-12)">
    <!-- Phone Shadow -->
    <rect x="-115" y="-195" width="230" height="400" rx="34" fill="#000" opacity="0.4" filter="blur(10px)" />
    <!-- Phone Case/Bezel -->
    <rect x="-110" y="-190" width="220" height="380" rx="32" fill="#0B2B26" stroke="#235347" stroke-width="3" />
    <!-- Screen Glass -->
    <rect x="-100" y="-180" width="200" height="360" rx="24" fill="#051F20" stroke="#163832" stroke-width="1.5" />

    <!-- Boarding Pass Notification Screen -->
    <rect x="-85" y="-140" width="170" height="80" rx="12" fill="#0B2B26" stroke="#235347" />
    <text x="-70" y="-115" fill="#8EB69B" font-family="sans-serif" font-size="9" font-weight="700">FLIGHT OTP → LHR</text>
    <text x="-70" y="-95" fill="#DAF1DE" font-family="sans-serif" font-size="12" font-weight="800">BOARDING: GATE 14</text>
    <text x="-70" y="-75" fill="#DE1110" font-family="sans-serif" font-size="9" font-weight="600">DEPARTS IN 45 MIN</text>

    <!-- Point of Impact Impact Glow -->
    <circle cx="20" cy="50" r="45" fill="url(#impactGlow)" />

    <!-- Spiderweb Glass Cracks emanating from impact point (20, 50) -->
    <g stroke="#DAF1DE" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
      <path d="M20 50 L-40 -20 L-80 -60" />
      <path d="M20 50 L-10 -70 L0 -150" />
      <path d="M20 50 L60 -30 L95 -90" />
      <path d="M20 50 L85 40 L98 80" />
      <path d="M20 50 L50 120 L80 170" />
      <path d="M20 50 L-20 110 L-60 165" />
      <path d="M20 50 L-70 60 L-95 70" />
      <path d="M20 50 L-50 15 L-90 -10" />

      <!-- Concentric fracture rings -->
      <path d="M-10 30 C 5 20, 35 25, 45 45 C 50 65, 30 80, 5 75 C -15 70, -20 45, -10 30" fill="none" stroke-width="1" />
      <path d="M-30 10 C 0 -10, 55 0, 70 35 C 80 75, 45 105, 0 100 C -40 90, -50 40, -30 10" fill="none" stroke-width="1" opacity="0.7" />
      <path d="M-55 -20 C -10 -45, 80 -30, 95 20 C 105 85, 60 135, -20 125 C -70 115, -85 30, -55 -20" fill="none" stroke-width="0.8" opacity="0.5" />
    </g>

    <!-- Glitch / Black bleeding ink spot on OLED -->
    <ellipse cx="20" cy="50" rx="14" ry="12" fill="#000" stroke="#DE1110" stroke-width="1" />
  </g>

  <!-- Travel Luggage Silhouette on Left -->
  <rect x="120" y="220" width="100" height="150" rx="16" fill="#0B2B26" stroke="#235347" stroke-width="2" />
  <rect x="155" y="190" width="30" height="30" rx="4" fill="none" stroke="#235347" stroke-width="3" />
  <line x1="120" y1="270" x2="220" y2="270" stroke="#163832" stroke-width="2" />

  <!-- Alert Badge -->
  <g transform="translate(40, 40)">
    <rect width="250" height="36" rx="18" fill="#051F20" stroke="#DE1110" stroke-width="1.5" />
    <circle cx="22" cy="18" r="6" fill="#DE1110" />
    <text x="38" y="23" fill="#DAF1DE" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">SMARTPHONE SPART ÎNAINTE DE ZBOR</text>
  </g>
</svg>
