<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fuelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051F20" />
      <stop offset="50%" stop-color="#0B2B26" />
      <stop offset="100%" stop-color="#163832" />
    </linearGradient>
    <linearGradient id="nozzleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#fuelBg)" />

  <!-- Car body silhouette on right -->
  <path d="M420 160 C520 150, 680 180, 800 240 L800 500 L380 500 L380 280 C380 200, 400 165, 420 160 Z" fill="#0B2B26" stroke="#235347" stroke-width="2" />
  
  <!-- Open Fuel Tank Flap -->
  <ellipse cx="500" cy="280" rx="45" ry="45" fill="#051F20" stroke="#8EB69B" stroke-width="3" />
  <!-- Inner Cap & Warning Label -->
  <circle cx="500" cy="280" r="32" fill="#163832" stroke="#DE1110" stroke-width="2.5" />
  <text x="500" y="275" fill="#DAF1DE" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="1">DIESEL</text>
  <text x="500" y="290" fill="#DE1110" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">ONLY</text>

  <!-- Fuel Dispenser Pump on Left -->
  <rect x="80" y="100" width="160" height="360" rx="16" fill="#0B2B26" stroke="#235347" stroke-width="3" />
  <!-- Display screen on pump -->
  <rect x="105" y="130" width="110" height="70" rx="6" fill="#051F20" stroke="#163832" />
  <text x="160" y="160" fill="#8EB69B" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">BENZINĂ 95</text>
  <text x="160" y="182" fill="#22C55E" font-family="monospace" font-size="12" text-anchor="middle">52.40 LITRI</text>

  <!-- Green Petrol Pump Handle & Hose into Diesel Flap -->
  <path d="M160 380 C160 480, 360 420, 460 310" stroke="#163832" stroke-width="14" fill="none" stroke-linecap="round" />
  <!-- Nozzle inserted into flap -->
  <g transform="translate(460, 270) rotate(-25)">
    <rect x="-40" y="-10" width="60" height="20" rx="4" fill="url(#nozzleGrad)" stroke="#15803D" stroke-width="1.5" />
    <path d="M20 -4 L60 -4 L60 4 L20 4 Z" fill="#8EB69B" />
    <rect x="-30" y="10" width="20" height="35" rx="3" fill="#051F20" stroke="#22C55E" stroke-width="2" />
  </g>

  <!-- Warning Contamination Pulse -->
  <circle cx="500" cy="280" r="60" fill="none" stroke="#DE1110" stroke-width="2" stroke-dasharray="6 4" opacity="0.8" />
  <circle cx="500" cy="280" r="80" fill="none" stroke="#DE1110" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />

  <!-- Alert Badge -->
  <g transform="translate(40, 40)">
    <rect width="250" height="36" rx="18" fill="#051F20" stroke="#DE1110" stroke-width="1.5" />
    <circle cx="22" cy="18" r="6" fill="#DE1110" />
    <text x="38" y="23" fill="#DAF1DE" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">ALIMENTARE ERONATĂ (BENZINĂ / DIESEL)</text>
  </g>
</svg>
