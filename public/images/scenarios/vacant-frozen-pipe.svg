<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Dark chilly vacant room gradient -->
    <linearGradient id="vacantRoomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051F20" />
      <stop offset="50%" stop-color="#0B2B26" />
      <stop offset="100%" stop-color="#163832" />
    </linearGradient>

    <!-- Copper pipe with cold metallic shine -->
    <linearGradient id="coldPipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#163832" />
      <stop offset="50%" stop-color="#8EB69B" />
      <stop offset="100%" stop-color="#0B2B26" />
    </linearGradient>

    <!-- Massive water flood glow -->
    <radialGradient id="vacantWaterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DAF1DE" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#8EB69B" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#163832" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#051F20" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Wall Background -->
  <rect width="800" height="500" fill="url(#vacantRoomBg)" />

  <!-- Window on left showing snow & frost outside -->
  <rect x="70" y="100" width="160" height="180" rx="4" fill="#0B2B26" stroke="#235347" stroke-width="3" />
  <rect x="78" y="108" width="68" height="78" fill="#163832" opacity="0.6" />
  <rect x="154" y="108" width="68" height="78" fill="#163832" opacity="0.6" />
  <rect x="78" y="194" width="68" height="78" fill="#163832" opacity="0.6" />
  <rect x="154" y="194" width="68" height="78" fill="#163832" opacity="0.6" />
  <!-- Frost patterns on window glass -->
  <text x="150" y="270" fill="#8EB69B" font-family="sans-serif" font-size="9" text-anchor="middle">TEMPERATURI SUB ZERO</text>

  <!-- Thermostat on wall showing unheated room -->
  <g transform="translate(270, 110)">
    <rect width="90" height="88" rx="8" fill="#051F20" stroke="#8EB69B" stroke-width="1.5" />
    <circle cx="45" cy="40" r="24" fill="#0B2B26" stroke="#DE1110" stroke-width="2" />
    <path d="M45 28 L45 52 M37 36 L53 44 M37 44 L53 36" stroke="#DAF1DE" stroke-width="1.5" />
    <text x="45" y="74" fill="#DE1110" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">IMOBIL NEÎNCĂLZIT</text>
  </g>

  <!-- Flooring and room perspective -->
  <rect x="0" y="340" width="800" height="160" fill="#07201D" />
  <line x1="0" y1="340" x2="800" y2="340" stroke="#235347" stroke-width="2.5" />
  <path d="M-60 500 L220 340 M140 500 L360 340 M380 500 L490 340 M650 500 L630 340 M880 500 L760 340" stroke="#0B2B26" stroke-width="2" opacity="0.6" />

  <!-- Vertical Pipe in wall chase -->
  <rect x="520" y="60" width="22" height="150" rx="3" fill="url(#coldPipe)" stroke="#163832" stroke-width="1" />
  <rect x="520" y="250" width="22" height="100" rx="3" fill="url(#coldPipe)" stroke="#163832" stroke-width="1" />
  
  <!-- Pipe Brackets -->
  <rect x="512" y="90" width="38" height="10" rx="2" fill="#235347" />
  <rect x="512" y="280" width="38" height="10" rx="2" fill="#235347" />

  <!-- Frozen Burst Rupture in Pipe -->
  <path d="M520 210 C500 215, 498 245, 520 250 L542 250 C564 245, 560 215, 542 210 Z" fill="#235347" stroke="#DE1110" stroke-width="2" />
  <path d="M526 215 Q536 230 530 240 Q537 248 532 250" stroke="#DE1110" stroke-width="3" fill="none" />
  
  <!-- Ice block pushing through metal -->
  <polygon points="528,220 538,225 534,236 525,230" fill="#DAF1DE" opacity="0.9" />

  <!-- High-pressure escaping water cascade (Unchecked for days) -->
  <path d="M532 225 C470 180, 380 230, 310 320" stroke="#DAF1DE" stroke-width="4" fill="none" opacity="0.9" stroke-linecap="round" />
  <path d="M532 225 C490 190, 420 240, 360 340" stroke="#8EB69B" stroke-width="2.5" fill="none" opacity="0.7" stroke-dasharray="8 4" />
  <path d="M535 225 C580 185, 660 220, 720 310" stroke="#DAF1DE" stroke-width="3.5" fill="none" opacity="0.85" stroke-linecap="round" />
  
  <!-- Water pouring straight down down wall -->
  <path d="M525 250 L522 345 L520 400" stroke="#DAF1DE" stroke-width="6" fill="none" opacity="0.85" />
  <path d="M535 250 L538 345 L535 400" stroke="#8EB69B" stroke-width="4" fill="none" opacity="0.7" />

  <!-- Wall plaster peeling & discoloration from persistent water -->
  <path d="M500 240 Q470 280 490 340 L560 340 Q570 270 550 230 Z" fill="#0B2B26" opacity="0.8" />
  <path d="M480 300 Q460 330 480 340" stroke="#235347" stroke-width="2" fill="none" />

  <!-- Vast Standing Water Flood Across Empty Home Floor -->
  <ellipse cx="400" cy="425" rx="350" ry="60" fill="url(#vacantWaterGlow)" />
  <ellipse cx="410" cy="425" rx="290" ry="45" fill="#8EB69B" opacity="0.4" />
  <ellipse cx="390" cy="430" rx="200" ry="28" fill="#DAF1DE" opacity="0.3" />

  <!-- Splashes and floor ripples -->
  <ellipse cx="528" cy="405" rx="40" ry="12" fill="none" stroke="#DAF1DE" stroke-width="2" opacity="0.8" />
  <ellipse cx="528" cy="405" rx="75" ry="20" fill="none" stroke="#8EB69B" stroke-width="1.5" opacity="0.5" />

  <!-- Submerged furniture leg & swollen skirting board -->
  <rect x="640" y="320" width="80" height="25" fill="#163832" stroke="#235347" />
  <rect x="660" y="345" width="20" height="60" fill="#0B2B26" stroke="#163832" />
  <line x1="640" y1="340" x2="720" y2="340" stroke="#DE1110" stroke-width="1.5" stroke-dasharray="4 2" />

  <!-- Editorial Alert Badge (Top-Left) -->
  <g transform="translate(40, 40)">
    <rect width="280" height="38" rx="19" fill="#051F20" stroke="#DE1110" stroke-width="2" />
    <circle cx="22" cy="19" r="6" fill="#DE1110" />
    <text x="38" y="24" fill="#DAF1DE" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">AVARIE DE ÎNGHEȚ — IMOBIL NEOCUPAT</text>
  </g>
</svg>
