  <circle cx="210" cy="310" r="9" fill="#DAF1DE" opacity="0.8" />
  <!-- Tag -->
  <g transform="translate(40, 40)">
    <rect width="180" height="34" rx="17" fill="#051F20" stroke="#DE1110" stroke-width="1.5" />
