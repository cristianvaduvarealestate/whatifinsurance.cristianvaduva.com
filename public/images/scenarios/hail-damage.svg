  <circle cx="310" cy="220" r="10" fill="#DAF1DE" stroke="#8EB69B" stroke-width="2" />
  <circle cx="460" cy="190" r="14" fill="#DAF1DE" stroke="#8EB69B" stroke-width="2" />
