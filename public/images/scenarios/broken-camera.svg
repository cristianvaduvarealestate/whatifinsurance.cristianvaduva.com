<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051F20" />
      <stop offset="60%" stop-color="#0B2B26" />
      <stop offset="100%" stop-color="#163832" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#rockBg)" />

  <!-- Mountain Trail Sharp Rocks -->
  <path d="M-50 480 L180 340 L340 420 L520 310 L700 450 L850 360 L850 500 L-50 500 Z" fill="#051F20" stroke="#163832" stroke-width="2" />
  <path d="M120 400 L260 480 M440 380 L580 470 M620 420 L760 490" stroke="#0B2B26" stroke-width="3" />

  <!-- Detached Camera Body (Sony Alpha / Mirrorless Style) -->
  <g transform="translate(320, 270) rotate(-15)">
    <!-- Camera Body Silhouette -->
    <rect x="-90" y="-60" width="180" height="120" rx="14" fill="#0B2B26" stroke="#235347" stroke-width="3" />
    <!-- Grip -->
    <rect x="50" y="-55" width="45" height="110" rx="10" fill="#163832" />
    <!-- Top Dial & Shutter Button -->
    <rect x="40" y="-75" width="22" height="15" rx="3" fill="#8EB69B" />
    <circle cx="-50" cy="-68" r="10" fill="#235347" />

    <!-- Open Lens Mount / Broken Bayonet Ring -->
    <circle cx="-10" cy="5" r="38" fill="#051F20" stroke="#DE1110" stroke-width="3" />
    <circle cx="-10" cy="5" r="30" fill="#163832" />
    <!-- Exposed Sensor with crack lines -->
    <rect x="-24" y="-10" width="28" height="26" rx="2" fill="#0B2B26" stroke="#8EB69B" stroke-width="1.5" />
    <line x1="-24" y1="-5" x2="4" y2="12" stroke="#DE1110" stroke-width="2" />
  </g>

  <!-- Detached Broken Lens lying separately on rocks -->
  <g transform="translate(560, 340) rotate(40)">
    <rect x="-40" y="-60" width="80" height="120" rx="10" fill="#0B2B26" stroke="#235347" stroke-width="3" />
    <!-- Glass Front Element with Spiderweb Cracks -->
    <ellipse cx="0" cy="60" rx="38" ry="14" fill="#163832" stroke="#DAF1DE" stroke-width="2" />
    <!-- Crack lines on front glass -->
    <path d="M-20 60 L10 55 L25 68 M0 50 L-5 70" stroke="#DAF1DE" stroke-width="1.5" stroke-linecap="round" />
    <!-- Broken Mount Flange -->
    <rect x="-30" y="-70" width="60" height="10" rx="2" fill="#DE1110" stroke="#DAF1DE" stroke-width="1" />
  </g>

  <!-- Impact Dust & Spark Accents -->
  <circle cx="430" cy="330" r="4" fill="#DE1110" />
  <circle cx="450" cy="310" r="3" fill="#8EB69B" />
  <circle cx="420" cy="350" r="2.5" fill="#DAF1DE" />

  <!-- Alert Badge -->
  <g transform="translate(40, 40)">
    <rect width="270" height="36" rx="18" fill="#051F20" stroke="#DE1110" stroke-width="1.5" />
    <circle cx="22" cy="18" r="6" fill="#DE1110" />
    <text x="38" y="23" fill="#DAF1DE" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">ECHIPAMENT FOTO ÎMPRUMUTAT DISTRUS</text>
  </g>
</svg>
